name: FlameWill upload artifact
description: actions/upload-artifact with the same inputs. On a FlameWill runner FlameWill keeps the artifact; everywhere else it is actions/upload-artifact.
author: FlameWill
branding:
  icon: upload-cloud
  color: orange

# Every input is actions/upload-artifact's (v7, the latest; v4's are the same less archive), with the same default. On a FlameWill runner the files are found by actions/upload-artifact's
# own search (dist/stage.mjs) and kept by FlameWill (fw-artifact): the same archive layout, listed and downloaded on the organization's
# FlameWill dashboard, read back in the same run by FlameWill/download-artifact. GitHub's own action keeps it instead when the job is not
# on a FlameWill runner, when overwrite is true (FlameWill keeps a name once a run attempt), when archive is false (FlameWill keeps
# zips), when the name has characters FlameWill does
# not keep, or when FlameWill could not keep it: the step says which, and where the artifact went.
inputs:
  name:
    description: Artifact name.
    default: artifact
  path:
    description: A file, directory or wildcard pattern that describes what to upload (one per line; ! excludes).
    required: true
  if-no-files-found:
    description: 'The behavior if no files are found: warn, error or ignore.'
    default: warn
  retention-days:
    description: Days after which the artifact expires (on GitHub). FlameWill keeps every artifact for its own retention, shown on flamewill.com.
    default: '0'
  compression-level:
    description: The zlib compression level for the archive (on GitHub).
    default: '6'
  overwrite:
    description: Replace an artifact of the same name. FlameWill keeps a name once a run attempt, so true uploads to GitHub.
    default: 'false'
  include-hidden-files:
    description: Whether hidden files are included.
    default: 'false'
  archive:
    description: Whether the files are zipped. false uploads one file as it is, to GitHub (FlameWill keeps zips).
    default: 'true'

outputs:
  artifact-id:
    description: GitHub's artifact id, when GitHub kept it.
    value: ${{ steps.github.outputs.artifact-id }}
  artifact-url:
    description: Where the artifact is downloaded (the FlameWill dashboard, or GitHub).
    value: ${{ steps.flamewill.outputs.url || steps.github.outputs.artifact-url }}
  artifact-digest:
    description: The SHA-256 of the archive, when GitHub kept it.
    value: ${{ steps.github.outputs.artifact-digest }}
  kept-by:
    description: Who kept the artifact - flamewill or github (GitHub's action also reports when no files were found).
    value: ${{ steps.flamewill.outputs.kept == 'true' && 'flamewill' || 'github' }}

runs:
  using: composite
  steps:
    - name: Keep the artifact on FlameWill
      id: flamewill
      shell: bash
      env:
        INPUT_NAME: ${{ inputs.name }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_IF_NO_FILES_FOUND: ${{ inputs.if-no-files-found }}
        INPUT_INCLUDE_HIDDEN_FILES: ${{ inputs.include-hidden-files }}
        INPUT_OVERWRITE: ${{ inputs.overwrite }}
        INPUT_RETENTION_DAYS: ${{ inputs.retention-days }}
        INPUT_ARCHIVE: ${{ inputs.archive }}
      run: |
        # bash 3.2 too (a macOS runner's): nothing here needs a newer shell, so every runner reaches the fallback
        set -uo pipefail
        github() { echo "FlameWill upload artifact: $1, so GitHub keeps $INPUT_NAME (actions/upload-artifact)"; echo "kept=false" >> "$GITHUB_OUTPUT"; exit 0; }
        command -v fw-artifact >/dev/null 2>&1 || github "not a FlameWill runner"
        [ "$(printf %s "$INPUT_OVERWRITE" | tr "[:upper:]" "[:lower:]")" != true ] || github "overwrite is true (FlameWill keeps a name once a run attempt)"
        [ "$(printf %s "$INPUT_ARCHIVE" | tr "[:upper:]" "[:lower:]")" != false ] || github "archive is false (FlameWill keeps zips)"
        [[ "$INPUT_NAME" =~ ^[A-Za-z0-9._-]{1,100}$ ]] && [ -n "${INPUT_NAME//./}" ] || github "the name has characters FlameWill does not keep (A-Z a-z 0-9 . _ -)"
        # the image's own pinned Node (the one its actions/cache service runs on), else the job's
        node=/opt/flamewill/actions-cache/node
        [ -x "$node" ] || node=$(command -v node || true)
        [ -n "$node" ] || github "no Node on this runner to find the files with"
        stage=$(mktemp -d "${RUNNER_TEMP:-/tmp}/.fw-upload.XXXXXX") || github "no staging directory"
        trap 'rm -rf "$stage"' EXIT
        "$node" "$GITHUB_ACTION_PATH/dist/stage.mjs" "$stage"
        case $? in
          0) ;;
          3) github "no files were found with the provided path" ;;
          *) github "the files could not be staged (the line above says why)" ;;
        esac
        if (cd "$stage" && fw-artifact upload "$INPUT_NAME" .); then
          [ "$INPUT_RETENTION_DAYS" = 0 ] || echo "FlameWill keeps $INPUT_NAME for its own retention (shown on flamewill.com), not retention-days: $INPUT_RETENTION_DAYS"
          owner=${GITHUB_REPOSITORY%%/*}
          echo "kept=true" >> "$GITHUB_OUTPUT"
          echo "url=https://flamewill.com/dashboard/artifacts/?org=${owner}&repository=${GITHUB_REPOSITORY}&run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
        else
          github "FlameWill could not keep it (the line above says why)"
        fi

    - name: Upload the artifact to GitHub
      id: github
      if: steps.flamewill.outputs.kept == 'false'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: ${{ inputs.overwrite }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        archive: ${{ inputs.archive }}
